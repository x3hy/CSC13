<!DOCTYPE html>
<!-- Sign in page -->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title id="title">Sign In</title>
	<link rel=stylesheet href="src/styles.css">
	<script src="src/public/index.js"></script>
	<script defer>
		
		// Wait for the entire page to load before doing anything with the UI
		document.addEventListener("DOMContentLoaded", () => {
			
			// Move to the dashboard if the user is already signed in
			(async ()=>{
				document.body.style.display = "none"
				await validate_session_permanence(()=>{});
				if (_is_valid)
					open_dashboard();
				else document.body.style.display = "";
			})();
			
			
			// Load elements
			const _form_submit = document.getElementById("login-form-submit");
			const _form_switch = document.getElementById("login-form-switch");
			const _form_header = document.getElementById("login-form-header");
			const _form_errors = document.getElementById("login-form-errors");
			const _form = document.getElementById("login-form");
			const _title = document.getElementById("title");
			let form_mode = 0; // 0 = sign_in, 1 = sign_up
			
			
			// Shows an error message on the UI
			function set_error(msg){
				function clear_error(){
					_form_errors.innerText = "";
					_form_errors.style.display = "none";
				}
				
				if (msg == undefined){
					clear_error();
					return;
				}
				
				_form_errors.innerText = msg;
				_form_errors.style.display = "block";
				setTimeout(clear_error, 3000);
			}
			
			
			// Sets the display in a certain mode
			function set_form_mode(){
				_form.querySelectorAll(".sign-up").forEach(element => {
					element.style.display = (!form_mode) ? "none" : "";
				});
				
				// Set text elements
				_form_header.innerText = (!form_mode) ? "Sign In" : "Sign Up";
				_form_switch.innerText = (form_mode) ? "Sign In" : "Sign Up";
			}
			
			
			// Toggle between sign-in and sign-up modes
			set_form_mode();
			_form_switch.addEventListener("click", ()=>{
				form_mode = !form_mode;
				set_form_mode();
			});
			
			
			// Form-submission quirks
			let form_submit = false;
			_form_submit.addEventListener("click", ()=>{form_submit = true});
			_form.addEventListener("submit", (e) => {
				e.preventDefault();
				if (form_submit == false)
					return;
				form_submit = false;
				
				// Clear old errors on click
				set_error();
			
				// Executed on submission:
				let data = Object.fromEntries((new FormData(_form)).entries()); 
	
				
				// Check if the passwords match when signing up
				if (form_mode && data.password != data.passwordconfirm){
					set_error("Passwords do not match");
					return;
				}
			
				// Ensure that a username has been provided
				if (data.username == ""){
					set_error("Username is required");
					return;
				}
				
				// Ensure that a password has been provided
				if (data.password == ""){
					set_error("Password is required");
					return
				};
				
				
				// Assumes sign-up until proven sign-in...
				if (data.display == "")
					delete data.display
				delete data.passwordconfirm;
				
				
				// Now to verify with the server to check if the properties are valid
				if (!(async () => {
					if (form_mode){
						// Sign up mode:
						
						// check username:
						const username_resp = await validate_username(data.username);
						if (await username_resp.status != 0){
							set_error(await username_resp.message);
							return false;
						}
						
						// check display name:
						if (data.display != undefined){
							const display_resp = await validate_display(data.display);
							if(await display_resp.status != 0){
								set_error(await display_resp.message);
								return false;
							}
						}
						
						// check password:
						const password_resp = await validate_password(data.password);
						if(await password_resp.status != 0){
							set_error(await password_resp.message);
							return false;
						}
						// Sign up user:
						const sign_up_resp = await sign_up(data.username, data.password,
							(data.display != undefined) ? data.display : null
						);
						
						if (await  sign_up_resp.status != 0){
							set_error(await sign_up_resp.message);
							return false;
						}
					}
					
					// Now both the username and displayname have been validated. The
					// password and username have been provided, we can now move over
					// to the sign in process
					const sign_in_resp = await sign_in(data.username, data.password);
					if (await  sign_in_resp.status != 0){
						set_error(await sign_in_resp.message);
						return false;
					}
					
					// Move to the dashboard page after successfully authenticating the user
					open_dashboard();
				})()) return;
			});
		});
	</script>
</head>
<body class="login-page">
	<nav id="navbar" class="nobg"></nav>
	<br>
	<div class="page-body">
		<form id="login-form" class="form-sign-in">
			
			<!-- Login form -->
			<center>
				<h2 id="login-form-header"></h2>
				<input type="text" placeholder="Username" name="username" autocomplete="username"><br>
				<input class="sign-up" type="text" placeholder="Display Name" name="display"><br class="sign-up">
				<input type="password" placeholder="Password" name="password" autocomplete="password"><br>
				<input class="sign-up" type="password" placeholder="Confirm Password" name="passwordconfirm"><br class="sign-up">

				<i id="login-form-errors" class="error"></i>
				<br>
			
				<!-- Action buttons -->
				<button id="login-form-submit" class="alt"><b>Submit</b></button>
				<b><button id="login-form-switch"></button></b>
				<br>
				<br>
				<sub>Please note that admins cannot change your password, this is an intentional part of the security system. Please remember your password or your account will be <b>lost forever</b></sub>
			</center>
			<br>
			<p>
		</form>
	</div>
</body>
</html>
