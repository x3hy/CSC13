<!DOCTYPE html>
<!-- Home page -->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title id="title">Error: </title>
	<link rel=stylesheet href="src/styles.css">

</head>
<body class="home-page">
	<nav id="navbar" class="nobg"></nav>
	<br>
	<div class="page-body">
		<center>
			<code>
				<h1 id="code"></h1>
			</code>
			<h4 id="reason"></h4>
		</center>
	</div>
	
	<script>
		validate_session_permanence(()=>{});
		// Handles the URL params
		const params = new URLSearchParams(String(location.href).split("?")[1]);
		for (let pair of params.entries()){
			if (pair[0] == "q") document.getElementById("reason").innerText = pair[1];
			if (pair[0] == "c") document.getElementById("code").innerText = pair[1];
		}
	</script>
</body>
