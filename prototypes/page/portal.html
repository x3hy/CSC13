<!DOCTYPE html>
<!-- Sign in page -->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title id="title">Sign in</title>
	<link rel=stylesheet href="src/styles.css">
	<script src="src/index.js"></script>
	<script defer>
		window.addEventListener("DOMContentLoaded", ()=>{
			// standin code for the projectspace api
			const title_element = document.getElementById("title");
			const title_states = ["Sign in", "Sign up"];
			let current_title_state = 1;

			const submit = document.getElementById("login-form-submit");
			const form = document.getElementById("login-form");
			const form_submit = document.getElementById("login-form-submit");
			const form_switch = document.getElementById("login-form-switch");

			form.addEventListener("submit", (e) => {
				e.preventDefault();
			});

			// Toggles page from sign in to sign up
			function toggle_page_state(){
				current_title_state = !current_title_state;
				const state = title_states[current_title_state ? 1 : 0];
				title_element.innerText = state;
				form_switch.innerText = state;
				form.classList.toggle("form-sign-in");
			}

			form_switch.addEventListener("click", toggle_page_state);
			toggle_page_state();


		});

	</script>
</head>
<body>
	<div class="page-body">
		<section>Please remember your username and password, part of our privacy policy ensures that if you forget your password, your account is locked forever.</section>
		<section>
			<form id="login-form" class="form-sign-in">
				<h2 id="login-form-header"></h2>
				<input class="sign-up" type="text" placeholder="Username" name="username" autocomplete="username"><br><br>
				<input class="sign-in" type="text" placeholder="Display Name" name="display"><br><br>
				<input class="sign-up" type="password" placeholder="Password" name="password" autocomplete="password"><br><br>
				<input class="sign-in" type="password" placeholder="Confirm Password" name="passwordconfirm"><br><br>
				<i id="login-form-errors"></i>
				<br>
				
				<!-- Action buttons -->
				<b>
					<button id="login-form-submit" class="alt">Submit</button>
					<button id="login-form-switch"></button>
				</b>
			</form>
		</section>
	</div>
</body>
</html>
