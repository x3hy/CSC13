<!DOCTYPE html>
<!-- Sign in page -->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title id="title">Sign in</title>
	<link rel=stylesheet href="src/portal.css">
	<script src="src/index.js"></script>
	<script defer>
		window.addEventListener("DOMContentLoaded", ()=>{
			// standin code for the projectspace api
			const title_element = document.getElementById("title");
			const title_states = ["Sign in", "Sign up"];
			let current_title_state = 1;

			const submit = document.getElementById("login-form-submit");
			const form = document.getElementById("login-form");
			const form_submit = document.getElementById("login-form-submit");
			const form_header = document.getElementById("login-form-header");
			const form_switch = document.getElementById("login-form-switch");

			form.addEventListener("submit", (e) => {
				e.preventDefault();
			});

			// Toggles page from sign in to sign up
			function toggle_page_state(){
				current_title_state = !current_title_state;
				const state = title_states[current_title_state ? 1 : 0];
				title_element.innerText = state;
				form_switch.innerText = state;
				form_header.innerText = state;
				form.classList.toggle("form-sign-in");
			}

			form_switch.addEventListener("click", toggle_page_state);
			toggle_page_state();
		});

	</script>
</head>
<body>
	<div class="page-body">
		<section class="main-content">
			<form id="login-form" class="form-sign-in">
				<h2 id="login-form-header"></h2>
				<input type="text" placeholder="Username" name="username" autocomplete="username">
				<label class="sign-up">
					<input type="text" placeholder="Display Name" name="display">
				</label>
				<input type="password" placeholder="Password" name="password" 
				<label class="sign-up">
					<input type="password" placeholder="Confirm Password" name="passwordconfirm">
				</label>
				<i id="login-form-errors"></i>
				<br>

				<label class="sign-up">
					Please remember your username and password, part of our privacy policy ensures that if you forget your password, your account is locked forever, the admins will not be able to reset your password.
				</label>

				<label class="sign-in">
					<details>
						<summary>
							Forgot Password?
						</summary>
						Sorry, there is nothing that we can do to retrive your account, security comes at a cost sometimes..
					</details>
				</label>
				
				<!-- Action buttons -->
				<button id="login-form-submit" class="alt">Submit</button>
				<button id="login-form-switch"></button>
			</form>
		</section>
	</div>
</body>
</html>
